[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-processor"
version = "0.1.0"
description = "Laboratory work 3: iterators, generators and streaming"
requires-python = ">=3.11"

[project.scripts]
stream-processor = "stream_processor.main:main"

[tool.setuptools.packages.find]
where = ["src"]
